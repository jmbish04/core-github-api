name: Drizzle Schema Analysis Report

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  analyze-schema:
    runs-on: ubuntu-latest
    name: Generate Schema Report
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Ensure Script is Executable
        run: chmod +x scripts/db/audit_drizzle_schema.py
          
      - name: Run Schema Analysis
        run: python scripts/db/audit_drizzle_schema.py --output drizzle-schema-report.md
        
      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-schema-report
          path: drizzle-schema-report.md
          retention-days: 14

      # Fails on NEW dead schema only. The pre-existing orphans are listed in
      # scripts/db/known-orphan-tables.txt: failing on those blocked every
      # unrelated pull request on debt that predates it, which is how a check
      # like this ends up deleted instead of obeyed.
      - name: Check for new orphaned tables
        run: |
          if grep -q "### New Orphaned Tables" drizzle-schema-report.md; then
            echo "::error::New orphaned Drizzle tables. Wire them up or delete them - do not add them to scripts/db/known-orphan-tables.txt to get this green."
            sed -n '/### New Orphaned Tables/,/^$/p' drizzle-schema-report.md
            exit 1
          fi

      # Not a failure: an allowlisted table that is now wired up is good news,
      # and the only thing to do about it is delete the line.
      - name: Report allowlist entries that can be removed
        if: always()
        run: |
          if grep -q "### Allowlisted Tables That Are No Longer Orphaned" drizzle-schema-report.md; then
            echo "::notice::Some allowlisted tables are no longer orphaned. Remove them from scripts/db/known-orphan-tables.txt."
            sed -n '/### Allowlisted Tables That Are No Longer Orphaned/,/^$/p' drizzle-schema-report.md
          fi
